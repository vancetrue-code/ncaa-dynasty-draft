<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NCAA Dynasty Draft Show</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#07111f;--line:#1e3a5f;--line2:#2a4f7a;--gold:#ffcc45;--green:#4ade80;--red:#f87171;--text:#eef6ff;--muted:#7aa3c8;--draftW:88px;--uniW:100px;--cellW:108px;--cellH:68px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;background:#07111f;color:var(--text)}
.app{height:100%;display:flex;flex-direction:column}

/* Header */
header{padding:10px 12px 8px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#0d1f38,#07111f);position:relative}
h1{font-size:15px;margin:0;letter-spacing:.08em;text-transform:uppercase;font-weight:900}
.sub{font-size:10px;color:var(--muted);margin-top:1px;letter-spacing:.04em}
.controls{display:grid;grid-template-columns:1fr auto auto;gap:6px;margin-top:8px}
select,button{border:1px solid var(--line2);border-radius:10px;background:rgba(255,255,255,.05);color:var(--text);min-height:38px;font-size:13px;font-weight:700;cursor:pointer;transition:background .15s}
button{padding:0 12px}
.adminBtn{background:rgba(255,180,0,.12);border-color:#8e7321;color:var(--gold)}
.conn-dot{position:absolute;top:12px;right:12px;width:7px;height:7px;border-radius:50%;background:#444;transition:background .5s}
.conn-dot.online{background:var(--green);box-shadow:0 0 6px var(--green)}
.conn-dot.offline{background:var(--red)}

/* Scorebar */
.scorebar{display:flex;gap:6px;padding:8px 10px;background:#060f1a;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.scorebar::-webkit-scrollbar{display:none}
.playerCard{min-width:96px;border:2px solid var(--line);border-radius:14px;padding:7px 8px;background:#0d1e35;text-align:center;transition:transform .2s,box-shadow .3s,border-color .3s;flex-shrink:0}
.playerCard.active{transform:translateY(-2px);border-color:var(--gold)!important;animation:cardPulse 2s ease-in-out infinite}
@keyframes cardPulse{0%,100%{box-shadow:0 0 0 2px rgba(255,204,69,.25),0 4px 16px rgba(255,204,69,.12)}50%{box-shadow:0 0 0 4px rgba(255,204,69,.4),0 4px 24px rgba(255,204,69,.22)}}
.playerCard.out{opacity:.75}
.pName{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);font-weight:600}
.pPts{font-size:20px;font-weight:900;color:var(--gold);line-height:1.1}
.pPts.up{animation:flashUp .45s ease-out}
.pPts.dn{animation:flashDn .45s ease-out}
@keyframes flashUp{0%{color:var(--green);transform:scale(1.35)}100%{color:var(--gold);transform:scale(1)}}
@keyframes flashDn{0%{color:var(--red);transform:scale(1.2)}100%{color:var(--gold);transform:scale(1)}}
.pTeam{font-size:11px;font-weight:800;line-height:1.2;margin-top:2px}
.pAdv{font-size:9px;color:var(--gold);font-weight:700;margin-top:2px}

/* Timer bar */
.timerProgress{height:3px;background:var(--line)}
.timerProgressBar{height:100%;background:var(--green);transition:width .5s linear,background .3s}

/* Turn bar */
.timerBar{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;background:#08101c;border-bottom:1px solid var(--line);gap:10px}
.turnText{flex:1;min-width:0}
.turnName{font-size:14px;font-weight:900;display:block}
.turnHint{font-size:10px;color:var(--muted)}
.timer{font-size:28px;font-weight:900;color:var(--green);font-variant-numeric:tabular-nums;min-width:52px;text-align:right;transition:color .3s}
.timer.warn{color:var(--gold)}
.timer.danger{color:var(--red);animation:timerBlink .5s ease-in-out infinite}
@keyframes timerBlink{0%,100%{opacity:1}50%{opacity:.5}}

/* Board */
.boardWrap{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:6px 8px 120px}
table{border-collapse:separate;border-spacing:4px;table-layout:fixed;min-width:calc(var(--draftW) + var(--uniW) + 17 * var(--cellW))}
th,td{width:var(--cellW);min-width:var(--cellW);max-width:var(--cellW);height:var(--cellH);border-radius:10px;border:1px solid #1c3455;text-align:center;font-weight:900;vertical-align:middle}
th{position:sticky;top:0;z-index:4;background:#0e1f36;font-size:9px;line-height:11px;text-transform:uppercase;padding:4px;letter-spacing:.04em;color:var(--muted)}
th.draftHead,td.draftCell{position:sticky;left:0;z-index:6;width:var(--draftW);min-width:var(--draftW);max-width:var(--draftW)}
th.uniHead,td.uniCell{position:sticky;left:calc(var(--draftW) + 4px);z-index:5;width:var(--uniW);min-width:var(--uniW);max-width:var(--uniW)}
th.draftHead,th.uniHead{z-index:8}
td.draftCell{background:#0b1a2e}
.draftBtn{width:100%;height:52px;border-radius:8px;background:linear-gradient(180deg,#1f9f56,#157a3e);border:1px solid #2fd67a;color:#fff;font-size:11px;font-weight:800;line-height:13px;cursor:pointer;transition:transform .1s,box-shadow .2s}
.draftBtn:not(:disabled):hover{box-shadow:0 0 14px rgba(47,214,122,.4)}
.draftBtn:not(:disabled):active{transform:scale(.96)}
.draftBtn:disabled{background:#2a3545;border-color:#3a4a5a;color:#566780;cursor:default}
.tile{background:linear-gradient(180deg,#162845,#0f1e37);font-size:22px;cursor:pointer;transition:transform .1s,box-shadow .2s;position:relative;overflow:hidden}
.tile:not(.disabled):hover{transform:scale(1.04);box-shadow:0 0 14px rgba(100,160,255,.25)}
.tile:not(.disabled):active{transform:scale(.97)}
.tile small{display:block;font-size:10px;color:#8ab4d8;font-weight:600}
.tile.disabled{opacity:.28;filter:grayscale(.8);cursor:default}
.tile.disabled:hover{transform:none;box-shadow:none}
.university{background:#0c1828;color:#5a7a9a;font-size:11px;font-weight:700}
.revealed{background:linear-gradient(180deg,#143322,#0c2218);border-color:#2a9954!important;font-size:12px;line-height:14px;padding:4px;overflow:hidden;text-overflow:ellipsis;color:#d4f0e0}
.revealed.pop{animation:revealPop .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes revealPop{0%{transform:scale(.75);opacity:0;background:linear-gradient(180deg,#1a6640,#104d2a)}60%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
.locked{background:linear-gradient(180deg,#2d2050,#1e1438);border-color:#a78bfa!important;color:#c4b5fd;font-size:22px;cursor:pointer;animation:lockGlow 2s ease-in-out infinite}
.locked small{display:block;font-size:9px;color:#ddd6fe;margin-top:2px;line-height:11px;font-weight:700}
@keyframes lockGlow{0%,100%{box-shadow:0 0 6px rgba(167,139,250,.3)}50%{box-shadow:0 0 18px rgba(167,139,250,.65)}}
.drafted td{border-color:rgba(255,255,255,.28)!important}
.specialRow td{background:#5a3f08!important;border-color:#ffcc45!important}

/* Bottom panel */
.bottomPanel{position:fixed;bottom:0;left:0;right:0;background:rgba(6,12,22,.97);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));z-index:10;backdrop-filter:blur(8px)}
.message{font-size:13px;font-weight:800;line-height:17px;max-height:36px;overflow:hidden}
.log{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}

/* Modal */
.modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.82);z-index:30;padding:16px;backdrop-filter:blur(4px)}
.hidden{display:none!important}
.box{width:min(480px,96vw);background:linear-gradient(180deg,#131f35,#0d1828);border:1px solid var(--line2);border-radius:20px;padding:20px;box-shadow:0 24px 80px rgba(0,0,0,.7)}
.box h2{margin:0 0 10px;color:var(--gold);font-size:22px;font-weight:900}
.box p{font-size:15px;line-height:1.5;color:#cfe0f5;margin:0}
.actions{display:grid;gap:8px;margin-top:16px}
.actions button{min-height:48px;font-size:15px;font-weight:800;border-radius:12px}
.yes{background:linear-gradient(180deg,#1f9f56,#157a3e);border-color:#2fd67a}
.no{background:linear-gradient(180deg,#5a1e2a,#3d1520);border-color:var(--red)}
.gold{background:linear-gradient(180deg,#7a5f10,#5a4008);border-color:var(--gold)}

/* Admin */
.adminPanel{position:fixed;left:8px;right:8px;bottom:90px;background:linear-gradient(180deg,#10192e,#0a1220);border:1px solid var(--gold);border-radius:16px;padding:14px;z-index:22;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.adminGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.adminGrid button{min-height:42px;font-size:13px}

/* Draft celebration */
#celebration{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:100;background:rgba(0,0,0,.9)}
.celeb{text-align:center;padding:32px;border-radius:24px;max-width:380px;width:92%;animation:celebIn .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes celebIn{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}
.celeb-who{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.8}
.celeb-verb{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;opacity:.6;margin:4px 0}
.celeb-team{font-size:34px;font-weight:900;line-height:1.1;margin:10px 0}
.celeb-pts{font-size:12px;opacity:.6;margin-top:6px}
.celeb-tap{margin-top:18px;font-size:11px;opacity:.4}
.advReveal{font-size:28px;color:var(--gold);font-weight:900;text-align:center;margin:14px 0}

/* Confetti */
#confetti{position:fixed;inset:0;pointer-events:none;z-index:99;display:none}

/* Toast */
#toast{position:fixed;bottom:115px;left:50%;transform:translateX(-50%);background:rgba(15,28,50,.96);border:1px solid var(--line2);border-radius:20px;padding:8px 18px;font-size:13px;font-weight:700;z-index:50;pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.4)}
#toast.show{opacity:1}

@media(min-width:700px){
  :root{--draftW:110px;--uniW:120px;--cellW:128px;--cellH:66px}
  h1{font-size:20px}
  .playerCard{min-width:110px}
  .pPts{font-size:22px}
}
</style>
</head>

<div id="modal" class="modal hidden">

  function tone(freq,dur,type,vol,delay){
    try{const c=gc(),o=c.createOscillator(),g=c.createGain();
    o.connect(g);g.connect(c.destination);o.type=type||'sine';o.frequency.value=freq;
    const t=c.currentTime+(delay||0);g.gain.setValueAtTime(vol||.2,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.start(t);o.stop(t+dur+.02)}catch(e){}}
  return{
    reveal(){tone(523,.08,'triangle',.18);tone(659,.12,'triangle',.15,.07);tone(784,.2,'triangle',.12,.14)},
    event(){tone(180,.4,'sawtooth',.28);tone(140,.6,'sawtooth',.22,.3)},
    draft(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,.25,'triangle',.28,i*.09))},
    lock(){tone(330,.15,'square',.14);tone(247,.35,'square',.1,.12)},
    warn(){tone(880,.04,'square',.07)},
    penalty(){tone(220,.2,'sawtooth',.22);tone(180,.3,'sawtooth',.18,.18)},
  }
})();

// ── Confetti ──
function launchConfetti(color){
  const canvas=document.getElementById('confetti');
  canvas.style.display='block';
  canvas.width=window.innerWidth;canvas.height=window.innerHeight;
  const ctx=canvas.getContext('2d');
  const pal=[color||'#ffcc45','#52d273','#ffffff','#56CCF2',color||'#BB6BD9'];
  const ps=Array.from({length:200},()=>({
    x:Math.random()*canvas.width,y:-20-Math.random()*120,
    w:Math.random()*10+5,h:Math.random()*6+3,
    color:pal[Math.floor(Math.random()*pal.length)],
    vx:(Math.random()-.5)*5,vy:Math.random()*4+3,
    ang:Math.random()*Math.PI*2,va:(Math.random()-.5)*.18
  }));
  let start=Date.now(),raf;
  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    let alive=false;
    ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.ang+=p.va;p.vy+=.06;
      if(p.y<canvas.height+20)alive=true;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.ang);
      ctx.fillStyle=p.color+'cc';ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore()});
    if(alive&&Date.now()-start<5000)raf=requestAnimationFrame(draw);
    else{canvas.style.display='none';cancelAnimationFrame(raf)}
  }
  draw();
}

// ── State ──
let state,modalTimer=null,prevPoints={},freshReveal=new Set();

function freshState(){
  const points={},eventMap={},used=new Set(),hiddenLocks={},draftedTeams={};
  PLAYERS.forEach(p=>points[p]=500);
  while(used.size<EVENT_BAG.length){let r=Math.floor(Math.random()*TEAMS.length),c=1+Math.floor(Math.random()*(COLS.length-1));used.add(r+'-'+c)}
  [...used].forEach((id,i)=>eventMap[id]=EVENT_BAG[i]);
  let hi=0,hv=-1;TEAMS.forEach((t,i)=>{if(t["Dynasty Point Budget (NIL)"]>hv){hv=t["Dynasty Point Budget (NIL)"];hi=i}});
  hiddenLocks[hi+'-'+COLS.indexOf("Dynasty Point Budget (NIL)")]=true;
  while(Object.keys(hiddenLocks).length<5){let r=Math.floor(Math.random()*TEAMS.length),c=1+Math.floor(Math.random()*(COLS.length-1));hiddenLocks[r+'-'+c]=true}
  return{revealed:{},drafted:{},draftedBy:{},draftedTeams,hiddenLocks,foundLocks:{},eventMap,log:[],points,active:0,activePlayers:[...PLAYERS],history:[],specialAvailable:true,specialAdded:false,turnEndsAt:Date.now()+60000};
}

function load(){try{state=JSON.parse(localStorage.getItem('ncaaBetaV12Fixed'))||freshState()}catch(e){state=freshState()}prevPoints={...state.points};save()}
function save(){
  const v=JSON.stringify(state),t=Date.now();
  localStorage.setItem('ncaaBetaV12Fixed',v);
  if(window._fbRef){window._lastSaveT=t;window._fbRef.set({v,t}).catch(()=>{})}
}
function snapshot(){state.history.push(JSON.stringify({...state,history:[]}));state.history=state.history.slice(-20)}
function currentPlayer(){return state.activePlayers[state.active]||null}
function viewPlayer(){return document.getElementById('viewPlayer').value}
function canAct(){return viewPlayer()==='Duce'||viewPlayer()===currentPlayer()}

function addLog(t){state.log.unshift(t);state.log=state.log.slice(0,50);document.getElementById('log').textContent=state.log[0]||'Ready.';save()}
function setMsg(t){document.getElementById('message').textContent=t}
function showToast(t,dur=2400){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),dur)}

function setupSelects(){
  const v=document.getElementById('viewPlayer'),a=document.getElementById('adminPlayer');
  v.innerHTML='';a.innerHTML='';
  PLAYERS.forEach(p=>{v.add(new Option(p,p));a.add(new Option(p,p))});
  v.onchange=render;
}

function renderScores(){
  const bar=document.getElementById('scorebar');
  bar.innerHTML='';
  PLAYERS.forEach(p=>{
    const drafted=state.draftedTeams[p],isActive=p===currentPlayer();
    const pts=state.points[p],prev=prevPoints[p]??pts,changed=pts!==prev;
    const card=document.createElement('div');
    card.className='playerCard'+(isActive?' active':'')+(drafted?' out':'');
    card.style.borderColor=COLORS[p];
    if(drafted)card.style.background=`linear-gradient(180deg,${COLORS[p]}33,#0d1e35)`;
    card.innerHTML=`<div class="pName">${p.split(' ')[0]}</div>`+
      (drafted?`<div class="pTeam" style="color:${COLORS[p]}">${drafted}</div>`
        :`<div class="pPts${changed?(pts>prev?' up':' dn'):''}">${pts}</div>`)+
      (ADV[p]&&!drafted?`<div class="pAdv">⭐ ADV</div>`:'');
    bar.appendChild(card);
  });
  const cp=currentPlayer();
  document.getElementById('turnName').textContent=cp||'Draft Complete!';
  document.getElementById('turnName').style.color=cp?COLORS[cp]:'var(--gold)';
  document.getElementById('turnHint').textContent=cp?(canAct()?'— YOUR TURN':'— view only'):'';
  prevPoints={...state.points};
}

function render(){
  renderScores();
  const table=document.getElementById('board');table.innerHTML='';
  const allTeams=state.specialAdded?[...TEAMS,SPECIAL_TEAM]:TEAMS;
  // Header row
  const head=document.createElement('tr');
  const dh=document.createElement('th');dh.textContent='Draft';dh.className='draftHead';head.appendChild(dh);
  COLS.forEach((c,i)=>{const th=document.createElement('th');th.textContent=c;if(i===0)th.className='uniHead';head.appendChild(th)});
  table.appendChild(head);
  // Data rows
  allTeams.forEach((team,r)=>{
    const tr=document.createElement('tr');
    if(state.drafted[r])tr.className='drafted';
    if(r>=TEAMS.length)tr.className+=' specialRow';
    if(state.draftedBy[r])tr.style.background=COLORS[state.draftedBy[r]]+'1a';
    // Draft cell
    const draftTd=document.createElement('td');draftTd.className='draftCell';
    const btn=document.createElement('button');btn.className='draftBtn';
    btn.textContent=state.drafted[r]?'DRAFTED':'Draft Team';
    btn.disabled=!!state.drafted[r]||!canAct()||!currentPlayer();
    btn.onclick=()=>confirmDraft(r);draftTd.appendChild(btn);tr.appendChild(draftTd);
    // Stat cells
    COLS.forEach((col,c)=>{
      const td=document.createElement('td'),id=r+'-'+c,isUni=c===0;
      const revealed=state.revealed[id]||state.drafted[r]||r>=TEAMS.length;
      if(isUni)td.classList.add('uniCell');
      if(state.draftedBy[r])td.style.background=COLORS[state.draftedBy[r]]+'28';
      if(state.foundLocks[id]&&!revealed){
        td.className+=' locked';td.innerHTML='🔒<small>UNLOCK<br>100 PTS</small>';td.onclick=()=>unlockTile(r,c);
      }else if(isUni&&!revealed){
        td.className+=' university';td.innerHTML='<b>LOCKED</b>';
      }else if(revealed){
        td.className+=' revealed';if(freshReveal.has(id))td.classList.add('pop');
        td.textContent=team[col];
      }else{
        const cost=COSTS[col];td.className+=' tile';
        if(!canAct()||state.points[currentPlayer()]<cost)td.className+=' disabled';
        td.innerHTML=`<span>${cost}</span><small>PTS</small>`;td.onclick=()=>tileClick(r,c);
      }
      tr.appendChild(td);
    });
    table.appendChild(tr);
  });
  freshReveal.clear();
}

function spend(p,cost,force=false){if(force){state.points[p]=Math.max(0,state.points[p]-cost);return true}if(state.points[p]<cost)return false;state.points[p]-=cost;return true}
function anyAffordable(p){return Object.values(COSTS).some(v=>v&&state.points[p]>=v)}

function tileClick(r,c){
  if(!canAct())return setMsg('Not your turn.');
  const p=currentPlayer(),id=r+'-'+c,col=COLS[c],cost=COSTS[col];
  if(c===0||state.drafted[r])return;
  if(state.points[p]<cost)return setMsg('Not enough points for this tile.');
  snapshot();
  if(state.hiddenLocks[id]){SFX.lock();delete state.hiddenLocks[id];state.foundLocks[id]=true;addLog(p+' found a locked tile!');setMsg('🔒 Locked tile found — turn ends.');endTurn();render();return}
  SFX.reveal();spend(p,cost);freshReveal.add(id);revealTile(r,c,true);endTurn();
}

function unlockTile(r,c){
  if(!canAct())return setMsg('Not your turn.');
  const p=currentPlayer(),id=r+'-'+c;
  if(state.points[p]<100)return setMsg('Need 100 points to unlock.');
  snapshot();SFX.reveal();spend(p,100);delete state.foundLocks[id];addLog(p+' unlocked tile for 100 pts.');freshReveal.add(id);revealTile(r,c,true);endTurn();
}

function revealTile(r,c,trigger){
  const id=r+'-'+c;state.revealed[id]=true;
  addLog(`${currentPlayer()} revealed Team ${r+1} — ${COLS[c]}: ${TEAMS[r]?.[COLS[c]]??'?'}`);
  if(trigger&&state.eventMap[id])handleEvent(state.eventMap[id],r,c);
  save();render();
}

function handleEvent(ev){
  addLog('EVENT: '+ev);SFX.event();
  if(ev==='Choose Player Lose 150 Dynasty Points')
    chooseTarget('Choose a player to lose 150 pts.',
      t=>{snapshot();spend(t,150,true);addLog(t+' lost 150 pts.');closeModal();render()},
      ()=>{const arr=state.activePlayers.filter(x=>x!==currentPlayer());const t=arr[Math.floor(Math.random()*arr.length)]||currentPlayer();spend(t,150,true);addLog('Random: '+t+' lost 150.');closeModal();render()});
  if(ev==='-100 Dynasty Points'){SFX.penalty();spend(currentPlayer(),100,true);showInfo('⚡ EVENT SPACE','−100 Dynasty Points for '+currentPlayer()+'!')}
  if(ev==='Must Draft Now')mustDraftNow();
  if(ev==='Special Team Offer')specialOffer();
}

function chooseTarget(prompt,cb,to){showTimed('⚡ CHOOSE TARGET',prompt,state.activePlayers.filter(p=>p!==currentPlayer()).map(p=>[p,'gold',()=>cb(p)]),to)}
function mustDraftNow(){showTimed('🚨 MUST DRAFT NOW','You must draft any available team now.',TEAMS.map((t,i)=>state.drafted[i]?null:[`${t.University}`,'yes',()=>draftTeam(i)]).filter(Boolean),()=>{const av=TEAMS.map((_,i)=>i).filter(i=>!state.drafted[i]);draftTeam(av[Math.floor(Math.random()*av.length)])})}
function specialOffer(){if(!state.specialAvailable)return;showTimed('⭐ SPECIAL TEAM OFFER','North Dakota State has entered the draft pool!',[['Draft North Dakota State','gold',draftSpecial],['Pass','no',()=>{state.specialAvailable=false;closeModal();render()}]],()=>{state.specialAvailable=false;addLog('Special team auto-passed.');closeModal();render()})}

function confirmDraft(r){
  if(!canAct())return setMsg('Not your turn.');
  const p=currentPlayer();
  if(ADV[p]&&r<TEAMS.length)
    showModal('ARE YOU SURE?',`You qualify for Huge Advantage Team (${ADV[p]}). Take it instead?`,
      [['Draft This Team','yes',()=>{snapshot();draftTeam(r)}],['Take Advantage Team ⭐','gold',()=>{snapshot();draftHugeAdv()}],['Cancel','no',closeModal]]);
  else
    showModal('CONFIRM DRAFT',`Draft this team for ${p}?`,
      [['Draft Team','yes',()=>{snapshot();draftTeam(r)}],['Cancel','no',closeModal]]);
}

function draftTeam(r){
  const p=currentPlayer();
  for(let c=0;c<COLS.length;c++)state.revealed[r+'-'+c]=true;
  state.drafted[r]=true;state.draftedBy[r]=p;
  const name=r<TEAMS.length?TEAMS[r].University:SPECIAL_TEAM.University;
  state.draftedTeams[p]=name;addLog(`${p} drafted ${name}!`);
  removePlayer(p);closeModal();save();showCelebration(p,name);
}

function showCelebration(player,team){
  SFX.draft();launchConfetti(COLORS[player]);
  const box=document.getElementById('celebBox');
  document.getElementById('celebWho').textContent=player;
  document.getElementById('celebWho').style.color=COLORS[player];
  document.getElementById('celebTeam').textContent=team;
  document.getElementById('celebTeam').style.color=COLORS[player];
  document.getElementById('celebPts').textContent=state.points[player]+' pts remaining';
  box.style.border='2px solid '+COLORS[player];
  box.style.background=`linear-gradient(180deg,${COLORS[player]}22,#0d1828)`;
  const cel=document.getElementById('celebration');cel.classList.remove('hidden');
  cel.onclick=()=>{cel.classList.add('hidden');render()};
  setTimeout(()=>{if(!cel.classList.contains('hidden')){cel.classList.add('hidden');render()}},5000);
}

function draftHugeAdv(){const p=currentPlayer(),team=ADV[p];state.draftedTeams[p]=team;addLog(`${p} CHOSE HUGE ADVANTAGE: ${team}`);removePlayer(p);closeModal();save();showCelebration(p,team+' ⭐')}
function draftSpecial(){const p=currentPlayer();state.specialAvailable=false;state.specialAdded=true;const r=TEAMS.length;for(let c=0;c<COLS.length;c++)state.revealed[r+'-'+c]=true;state.drafted[r]=true;state.draftedBy[r]=p;state.draftedTeams[p]='North Dakota State';addLog(`${p} drafted North Dakota State!`);removePlayer(p);closeModal();save();showCelebration(p,'North Dakota State ⭐')}
function removePlayer(p){const i=state.activePlayers.indexOf(p);if(i>=0){state.activePlayers.splice(i,1);if(state.active>=state.activePlayers.length)state.active=0}state.turnEndsAt=Date.now()+60000}

function endTurn(){
  if(state.activePlayers.length){
    state.active=(state.active+1)%state.activePlayers.length;state.turnEndsAt=Date.now()+60000;
    const cp=currentPlayer();
    if(!anyAffordable(cp)){showToast(cp.split(' ')[0]+' must draft — no affordable tiles!');setMsg(cp+' must draft.')}
  }
  save();render();
}

function timeoutTurn(){
  const p=currentPlayer();if(!p)return;snapshot();
  let cand=[];TEAMS.forEach((_,r)=>{if(!state.drafted[r])COLS.forEach((col,c)=>{const id=r+'-'+c;if(c>0&&!state.revealed[id]&&!state.foundLocks[id])cand.push([r,c])})});
  if(!cand.length)return endTurn();
  const[r,c]=cand[Math.floor(Math.random()*cand.length)],id=r+'-'+c;
  if(state.hiddenLocks[id]){delete state.hiddenLocks[id];state.foundLocks[id]=true;addLog('Timer: random tile was locked.');endTurn();return}
  SFX.reveal();spend(p,COSTS[COLS[c]],true);freshReveal.add(id);revealTile(r,c,true);endTurn();
}

function showModal(title,text,buttons){clearEventTimer();document.getElementById('modalTitle').textContent=title;document.getElementById('modalText').innerHTML=text;const a=document.getElementById('modalActions');a.innerHTML='';buttons.forEach(([l,cls,fn])=>{const b=document.createElement('button');b.textContent=l;b.className=cls;b.onclick=fn;a.appendChild(b)});document.getElementById('modal').classList.remove('hidden')}
function showTimed(title,text,buttons,to){let left=25;showModal(title,text+`<br><br><b id="etxt" style="color:var(--gold)">${left}s</b>`,buttons);modalTimer=setInterval(()=>{left--;const e=document.getElementById('etxt');if(e)e.textContent=left+'s';if(left<=0){clearEventTimer();to()}},1000)}
function clearEventTimer(){if(modalTimer){clearInterval(modalTimer);modalTimer=null}}
function closeModal(){clearEventTimer();document.getElementById('modal').classList.add('hidden')}
function showInfo(t,x){showModal(t,x,[['OK','yes',closeModal]])}
function toggleAdmin(){document.getElementById('adminPanel').classList.toggle('hidden')}
function adminSetActive(){const p=document.getElementById('adminPlayer').value,i=state.activePlayers.indexOf(p);if(i>=0){snapshot();state.active=i;state.turnEndsAt=Date.now()+60000;save();render()}}
function nextTurn(){snapshot();endTurn()}
function undoLast(){if(!state.history.length)return setMsg('Nothing to undo.');const h=state.history.pop(),old=state.history;state=JSON.parse(h);state.history=old;prevPoints={...state.points};save();render();showToast('↩ Undo applied')}
function resetBoardConfirm(){if(confirm('Reset the full board?')){state=freshState();prevPoints={...state.points};save();render()}}

function updateTimer(){
  const p=currentPlayer(),el=document.getElementById('timer'),bar=document.getElementById('tpBar');
  if(!p){el.textContent='DONE';el.className='timer';if(bar)bar.style.width='0%';return}
  const left=Math.max(0,Math.ceil((state.turnEndsAt-Date.now())/1000));
  el.textContent='0:'+String(left).padStart(2,'0');
  el.className='timer'+(left<=10?' danger':left<=20?' warn':'');
  if(bar){bar.style.width=(left/60*100)+'%';bar.style.background=left<=10?'var(--red)':left<=20?'var(--gold)':'var(--green)'}
  if(left<=10&&left>0&&left%2===0)SFX.warn();
  if(left<=0){state.turnEndsAt=Date.now()+999999;timeoutTurn()}
}
