<!doctype html>
<html>

<style>
:root{--line:#355071;--gold:#ffcc45;--green:#52d273;--red:#ff6565;--text:#eef6ff;--muted:#a9bdd4;--draftW:92px;--uniW:96px;--cellW:104px;--cellH:66px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{font-family:Arial,Helvetica,sans-serif;background:radial-gradient(circle at top,#173050,#07111f 58%);color:var(--text)}
.app{height:100%;display:flex;flex-direction:column}
header{padding:9px 10px 7px;border-bottom:1px solid var(--line);background:#07111f}
h1{font-size:16px;margin:0}.sub{font-size:11px;color:var(--muted);margin-top:2px}
.controls{display:grid;grid-template-columns:1fr auto;gap:6px;margin-top:7px}
.idBox,button{border:1px solid var(--line);border-radius:10px;background:#0b1524;color:var(--text);min-height:36px;font-size:13px;font-weight:800;padding:8px}
.adminBtn{background:#3a2f12;border-color:#8e7321}
.scorebar{display:flex;gap:7px;padding:7px 9px;background:#08101c;border-bottom:1px solid var(--line);overflow-x:auto}
.playerCard{min-width:104px;border:2px solid var(--line);border-radius:12px;padding:6px;background:#102039;text-align:center}
.playerCard.active{box-shadow:0 0 0 2px rgba(255,204,69,.38);border-color:var(--gold)!important}.playerCard.out{opacity:.95}
.playerName{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.playerPts{font-size:17px;font-weight:950;color:var(--gold)}
.draftedTeamName{font-size:13px;font-weight:950;color:white;line-height:14px;margin-top:2px}.advTag{font-size:9px;color:#fff}
.timerBar{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;background:#0b1524;border-bottom:1px solid var(--line)}
.turnText{font-size:13px;font-weight:900}.timer{font-size:26px;font-weight:1000;color:var(--green)}.timer.warn{color:var(--gold)}.timer.danger{color:var(--red)}
.boardWrap{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:6px 8px 106px}
table{border-collapse:separate;border-spacing:4px;table-layout:fixed;min-width:calc(var(--draftW) + var(--uniW) + 17 * var(--cellW))}
th,td{width:var(--cellW);min-width:var(--cellW);max-width:var(--cellW);height:var(--cellH);border-radius:10px;border:1px solid #2c4668;text-align:center;font-weight:950}
th{position:sticky;top:0;z-index:4;background:#14243b;font-size:10px;line-height:11px;text-transform:uppercase;padding:4px}
th.draftHead,td.draftCell{position:sticky;left:0;z-index:6;width:var(--draftW);min-width:var(--draftW);max-width:var(--draftW)}
th.uniHead,td.uniCell{position:sticky;left:calc(var(--draftW) + 4px);z-index:5;width:var(--uniW);min-width:var(--uniW);max-width:var(--uniW)}
th.draftHead,th.uniHead{z-index:8}td.draftCell{background:#102039}.draftBtn{width:100%;height:52px;border-radius:10px;background:#1f8f4e;border-color:#48d67f;color:white;font-size:11px;line-height:12px}.draftBtn:disabled{background:#555;border-color:#777;color:#aaa}

.university{background:#101826;color:#8096af;font-size:12px}.revealed{background:linear-gradient(180deg,#173d2a,#0f281c);border-color:#3bae66;font-size:13px;line-height:14px;padding:4px;overflow:hidden;text-overflow:ellipsis}
.locked{background:#3a3148;border-color:#c6a8ff;color:#d8c7ff;font-size:18px;cursor:pointer;line-height:18px}.locked small{display:block;font-size:9px;color:#fff;margin-top:2px}
.drafted td{color:#fff!important;border-color:rgba(255,255,255,.55)!important}.specialRow td{background:#6a5015!important;border-color:#ffcc45!important}
.bottomPanel{position:fixed;bottom:0;left:0;right:0;background:rgba(7,14,24,.98);border-top:1px solid var(--line);padding:9px 10px calc(9px + env(safe-area-inset-bottom));z-index:10}
.message{font-size:13px;font-weight:950;line-height:16px;max-height:34px;overflow:hidden}.log{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.72);z-index:30;padding:14px}.hidden{display:none}
.box{width:min(480px,96vw);background:#111c2e;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 18px 60px rgba(0,0,0,.5)}

.yes{background:#1f8f4e;border-color:#48d67f}.no{background:#4a2330;border-color:#ff6565}.gold{background:#6a5015;border-color:#ffcc45}

.turnFlash{animation:pulse 1s ease-in-out 3}@keyframes pulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.45)}}
@media(min-width:700px){:root{--draftW:110px;--uniW:120px;--cellW:125px;--cellH:64px}h1{font-size:22px}}
</style>
</head>

function save(mutator){if(!state||!ref||writeBusy)return;writeBusy=true;let s=JSON.parse(JSON.stringify(state));let h=JSON.parse(JSON.stringify(s));delete h.history;s.history=s.history||[];s.history.push(JSON.stringify(h));s.history=s.history.slice(-20);mutator(s);ref.set(s).finally(()=>writeBusy=false)}
function renderScores(){let bar=document.getElementById("scorebar");bar.innerHTML="";PLAYERS.forEach(p=>{let drafted=state.draftedTeams?.[p.id],card=document.createElement("div");card.className="playerCard"+(p.id===currentPlayer()?" active":"")+(drafted?" out":"");card.style.borderColor=p.color;if(drafted)card.style.background=`linear-gradient(180deg, ${p.color}, #111827)`;card.innerHTML=`<div class="playerName">${p.name}</div>`+(drafted?`<div class="draftedTeamName">${drafted}</div>`:`<div class="playerPts">${state.points?.[p.id]??0}</div>`)+(p.advantage&&!drafted?`<div class="advTag">ADV</div>`:"");bar.appendChild(card)});document.getElementById("turnText").textContent=currentPlayer()?`Current: ${pname(currentPlayer())}${canAct()?" — YOUR TURN":" — view only"}`:"Draft Complete";document.getElementById("log").textContent=state.log?.[0]||"Ready."}
function render(){if(!state)return;renderScores();let table=document.getElementById("board");table.innerHTML="";let all=state.specialAdded?[...TEAMS,SPECIAL_TEAM]:TEAMS;let head=document.createElement("tr"),dh=document.createElement("th");dh.textContent="Draft";dh.className="draftHead";head.appendChild(dh);COLS.forEach((c,i)=>{let th=document.createElement("th");th.textContent=c;if(i===0)th.className="uniHead";head.appendChild(th)});table.appendChild(head);all.forEach((team,r)=>{let tr=document.createElement("tr");if(state.drafted?.[r])tr.className="drafted";if(r>=TEAMS.length)tr.className+=" specialRow";let owner=state.draftedBy?.[r];if(owner)tr.style.background=pcolor(owner);let dtd=document.createElement("td");dtd.className="draftCell";let btn=document.createElement("button");btn.className="draftBtn";btn.textContent=state.drafted?.[r]?"DRAFTED":"Draft Team";btn.disabled=!!state.drafted?.[r]||!canAct()||!!state.pendingEvent||!currentPlayer();btn.onclick=()=>confirmDraft(r);dtd.appendChild(btn);tr.appendChild(dtd);COLS.forEach((col,c)=>{let td=document.createElement("td"),id=r+"-"+c,isUni=c===0,revealed=state.revealed?.[id]||state.drafted?.[r]||r>=TEAMS.length;if(isUni)td.classList.add("uniCell");if(owner)td.style.background=pcolor(owner);if(state.foundLocks?.[id]&&!revealed){td.className+=" locked";td.innerHTML="🔒<small>UNLOCK<br>100 PTS</small>";td.onclick=()=>unlockTile(r,c)}else if(isUni&&!revealed){td.className+=" university";td.innerHTML="<b>LOCKED</b>"}else if(revealed){td.className+=" revealed";td.textContent=team[col]}else{let cost=COSTS[col];td.className+=" tile";if(!canAct()||state.pendingEvent||(state.points?.[currentPlayer()]??0)<cost)td.className+=" disabled";td.innerHTML=`<span>${cost}</span><small>PTS</small>`;td.onclick=()=>tileClick(r,c)}tr.appendChild(td)});table.appendChild(tr)})}
function spend(s,p,cost,force=false){if(force){s.points[p]=Math.max(0,(s.points[p]||0)-cost);return true}if((s.points[p]||0)<cost)return false;s.points[p]-=cost;return true}
function anyAffordable(s,p){return Object.values(COSTS).some(v=>v&&(s.points?.[p]||0)>=v)}
function endTurn(s){s.pendingEvent=null;if(s.turnOrder.length){s.currentIndex=(s.currentIndex+1)%s.turnOrder.length;s.turnEndsAt=Date.now()+60000;if(!anyAffordable(s,s.turnOrder[s.currentIndex]))addLog(s,`${pname(s.turnOrder[s.currentIndex])} must draft — no affordable reveals.`)}}
function reveal(s,r,c,p){let id=r+"-"+c;s.revealed[id]=true;addLog(s,`${pname(p)} revealed Team ${r+1} — ${COLS[c]}: ${TEAMS[r][COLS[c]]}`);let ev=s.eventMap?.[id];if(!ev){endTurn(s);return}addLog(s,"EVENT: "+ev);if(ev==="-100 Dynasty Points"){spend(s,p,100,true);addLog(s,`${pname(p)} lost 100 points.`);endTurn(s);return}if(ev==="Special Team Offer"&&!s.specialAvailable){addLog(s,"SPECIAL TEAM ALREADY CLAIMED");endTurn(s);return}s.pendingEvent={id:Date.now()+"-"+Math.random(),ev,r,c,p,deadline:Date.now()+25000}}
function tileClick(r,c){if(!canAct())return setMsg("Wait for your turn.");let p=currentPlayer(),id=r+"-"+c,cost=COSTS[COLS[c]];if(c===0||state.drafted?.[r]||state.pendingEvent)return;if((state.points?.[p]||0)<cost)return setMsg("Cannot afford this tile.");save(s=>{if(s.hiddenLocks?.[id]){delete s.hiddenLocks[id];s.foundLocks[id]=true;addLog(s,`${pname(p)} found a locked tile.`);endTurn(s);return}spend(s,p,cost);reveal(s,r,c,p)})}
function unlockTile(r,c){if(!canAct())return setMsg("Wait for your turn.");let p=currentPlayer(),id=r+"-"+c;if((state.points?.[p]||0)<100)return setMsg("Need 100 points.");save(s=>{spend(s,p,100);delete s.foundLocks[id];addLog(s,`${pname(p)} unlocked a tile for 100.`);reveal(s,r,c,p)})}
function confirmDraft(r){if(!canAct())return setMsg("Wait for your turn.");let p=currentPlayer(),adv=PLAYER_BY_ID[p]?.advantage;if(adv&&r<TEAMS.length)showModal("ARE YOU SURE?","You qualify for a Huge Advantage Team.",[["Draft Selected Team","yes",()=>{closeModal();draftTeam(r)}],["Choose Huge Advantage Team","gold",()=>{closeModal();draftAdvantage()}],["Cancel","no",closeModal]]);else showModal("ARE YOU SURE?","Draft this team?",[["Draft Team","yes",()=>{closeModal();draftTeam(r)}],["Cancel","no",closeModal]])}
function removePlayer(s,p){let i=s.turnOrder.indexOf(p);if(i>=0){s.turnOrder.splice(i,1);if(s.currentIndex>=s.turnOrder.length)s.currentIndex=0}s.turnEndsAt=Date.now()+60000;s.pendingEvent=null}
function draftTeam(r){let p=currentPlayer();save(s=>{for(let c=0;c<COLS.length;c++)s.revealed[r+"-"+c]=true;s.drafted[r]=true;s.draftedBy[r]=p;s.draftedTeams[p]=r<TEAMS.length?TEAMS[r].University:SPECIAL_TEAM.University;addLog(s,`${pname(p)} drafted ${s.draftedTeams[p]}.`);removePlayer(s,p)})}
function draftAdvantage(){let p=currentPlayer(),team=PLAYER_BY_ID[p].advantage;showModal("HUGE ADVANTAGE TEAM",`<div class="advReveal">${pname(p)}<br>CHOSE A HUGE ADVANTAGE TEAM</div><div class="advReveal">${team}</div>`,[["Continue","yes",closeModal]]);save(s=>{s.draftedTeams[p]=team;addLog(s,`${pname(p)} CHOSE A HUGE ADVANTAGE TEAM: ${team}`);removePlayer(s,p)})}
function draftSpecial(){let p=currentPlayer();save(s=>{s.specialAvailable=false;s.specialAdded=true;let r=TEAMS.length;for(let c=0;c<COLS.length;c++)s.revealed[r+"-"+c]=true;s.drafted[r]=true;s.draftedBy[r]=p;s.draftedTeams[p]="North Dakota State";addLog(s,`${pname(p)} drafted North Dakota State.`);removePlayer(s,p)})}
function handlePendingAlert(){if(!state?.pendingEvent||!canAct())return;if(lastPending===state.pendingEvent.id)return;lastPending=state.pendingEvent.id;let pe=state.pendingEvent;if(pe.ev==="Choose Player Lose 150 Dynasty Points")showTimed("CHOOSE TARGET","Choose a player to lose 150.",state.turnOrder.filter(x=>x!==pe.p).map(x=>[pname(x),"gold",()=>{closeModal();save(s=>{spend(s,x,150,true);addLog(s,`${pname(x)} lost 150.`);endTurn(s)})}]),()=>{let arr=state.turnOrder.filter(x=>x!==pe.p),t=arr[Math.floor(Math.random()*arr.length)]||pe.p;save(s=>{spend(s,t,150,true);addLog(s,`Random target: ${pname(t)} lost 150.`);endTurn(s)})});if(pe.ev==="Must Draft Now")showTimed("MUST DRAFT NOW","You must draft any available team.",TEAMS.map((t,i)=>state.drafted?.[i]?null:[`Team ${i+1}`,"yes",()=>{closeModal();draftTeam(i)}]).filter(Boolean),()=>{let av=TEAMS.map((_,i)=>i).filter(i=>!state.drafted?.[i]);draftTeam(av[Math.floor(Math.random()*av.length)])});if(pe.ev==="Special Team Offer")showTimed("SPECIAL TEAM OFFER","A special team has entered the draft. Would you like to draft this team?",[["Draft Special Team","gold",()=>{closeModal();draftSpecial()}],["Pass","no",()=>{closeModal();save(s=>{s.specialAvailable=false;addLog(s,`${pname(pe.p)} passed on the special team.`);endTurn(s)})}]],()=>save(s=>{s.specialAvailable=false;addLog(s,"Special team auto-passed.");endTurn(s)}))}
function handleTurnAlert(){let cp=currentPlayer();if(!cp||lastTurn===cp)return;lastTurn=cp;if(cp===myId()){document.body.classList.add("turnFlash");if(navigator.vibrate)navigator.vibrate([200,100,200]);showModal("YOUR TURN",`It is now <b>${pname(cp)}</b>'s turn.`,[["Let's Go","yes",closeModal]])}}
function timeoutTurn(){if(!canAct()||state.pendingEvent)return;let p=currentPlayer();save(s=>{let cand=[];TEAMS.forEach((_,r)=>{if(!s.drafted?.[r])COLS.forEach((col,c)=>{let id=r+"-"+c;if(c>0&&!s.revealed?.[id]&&!s.foundLocks?.[id])cand.push([r,c])})});if(!cand.length){endTurn(s);return}let [r,c]=cand[Math.floor(Math.random()*cand.length)],id=r+"-"+c;if(s.hiddenLocks?.[id]){delete s.hiddenLocks[id];s.foundLocks[id]=true;addLog(s,"Timer expired. Random tile was locked.");endTurn(s);return}spend(s,p,COSTS[COLS[c]],true);reveal(s,r,c,p)})}
function showModal(title,text,buttons){clearModalTimer();document.getElementById("modalTitle").textContent=title;document.getElementById("modalText").innerHTML=text;let a=document.getElementById("modalActions");a.innerHTML="";buttons.forEach(([l,cls,fn])=>{let b=document.createElement("button");b.textContent=l;b.className=cls;b.onclick=fn;a.appendChild(b)});document.getElementById("modal").classList.remove("hidden")}
function showTimed(title,text,buttons,to){let left=Math.max(0,Math.ceil(((state.pendingEvent?.deadline||Date.now()+25000)-Date.now())/1000));showModal(title,text+`<br><br><b id="eventTimerText">${left}</b> seconds`,buttons);modalTimer=setInterval(()=>{left--;let e=document.getElementById("eventTimerText");if(e)e.textContent=Math.max(0,left);if(left<=0){clearModalTimer();closeModal();to()}},1000)}
function clearModalTimer(){if(modalTimer){clearInterval(modalTimer);modalTimer=null}}
function closeModal(){clearModalTimer();document.getElementById("modal").classList.add("hidden")}
function toggleAdmin(){if(!isAdmin())return alert("Use Duce admin link.");document.getElementById("adminPanel").classList.toggle("hidden")}
function adminSetActive(){if(!isAdmin())return;let p=document.getElementById("adminPlayer").value;save(s=>{let i=s.turnOrder.indexOf(p);if(i>=0){s.currentIndex=i;s.turnEndsAt=Date.now()+60000;s.pendingEvent=null}})}
function nextTurn(){if(isAdmin())save(s=>endTurn(s))}
function undoLast(){if(!isAdmin())return;let h=state.history||[];if(!h.length)return;let prev=JSON.parse(h[h.length-1]);prev.history=h.slice(0,-1);ref.set(prev)}
function resetBoardConfirm(){if(isAdmin()&&confirm("Reset full live draft?"))ref.set(makeState())}
function tick(){if(!state)return;if(state.pendingEvent){handlePendingAlert();return}let p=currentPlayer();if(!p){document.getElementById("timer").textContent="DONE";return}let left=Math.max(0,Math.ceil((state.turnEndsAt-Date.now())/1000)),el=document.getElementById("timer");el.textContent="0:"+String(left).padStart(2,"0");el.className="timer"+(left<=10?" danger":left<=30?" warn":"");if(left<=0&&canAct())timeoutTurn()}
init();setInterval(tick,500);
</script>
</body>
