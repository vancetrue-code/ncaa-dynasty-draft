<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Canonical local phone beta v1.3: built from Beta v1.2 FIXED. Event pool 15, 8-player draft order, player IDs, lock tile text. -->
<title>NCAA Dynasty Draft Show Beta v1.2 FIXED</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#07111f;--line:#355071;--gold:#ffcc45;--green:#52d273;--red:#ff6565;--text:#eef6ff;--muted:#a9bdd4;--draftW:92px;--uniW:96px;--cellW:104px;--cellH:66px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{font-family:Arial,Helvetica,sans-serif;background:radial-gradient(circle at top,#173050,#07111f 58%);color:var(--text)}
.app{height:100%;display:flex;flex-direction:column}
header{padding:9px 10px 7px;border-bottom:1px solid var(--line);background:#07111f}
h1{font-size:16px;margin:0}.sub{font-size:11px;color:var(--muted);margin-top:2px}
.controls{display:grid;grid-template-columns:1fr auto auto;gap:6px;margin-top:7px}
select,button{border:1px solid var(--line);border-radius:10px;background:#0b1524;color:var(--text);min-height:36px;font-size:13px;font-weight:800}
button{padding:0 9px}.adminBtn{background:#3a2f12;border-color:#8e7321}
.scorebar{display:flex;gap:7px;padding:7px 9px;background:#08101c;border-bottom:1px solid var(--line);overflow-x:auto}
.playerCard{min-width:104px;border:2px solid var(--line);border-radius:12px;padding:6px;background:#102039;text-align:center}
.playerCard.active{box-shadow:0 0 0 2px rgba(255,204,69,.38);border-color:var(--gold)}
.playerCard.out{opacity:.95}
.playerName{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.playerPts{font-size:17px;font-weight:950;color:var(--gold)}
.draftedTeamName{font-size:13px;font-weight:950;color:white;line-height:14px;margin-top:2px}
.timerBar{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;background:#0b1524;border-bottom:1px solid var(--line)}
.turnText{font-size:13px;font-weight:900}.timer{font-size:26px;font-weight:1000;color:var(--green)}.timer.warn{color:var(--gold)}.timer.danger{color:var(--red)}
.boardWrap{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:6px 8px 100px}
table{border-collapse:separate;border-spacing:4px;table-layout:fixed;min-width:calc(var(--draftW) + var(--uniW) + 17 * var(--cellW))}
th,td{width:var(--cellW);min-width:var(--cellW);max-width:var(--cellW);height:var(--cellH);border-radius:10px;border:1px solid #2c4668;text-align:center;font-weight:950}
th{position:sticky;top:0;z-index:4;background:#14243b;font-size:10px;line-height:11px;text-transform:uppercase;padding:4px}
th.draftHead,td.draftCell{position:sticky;left:0;z-index:6;width:var(--draftW);min-width:var(--draftW);max-width:var(--draftW)}
th.uniHead,td.uniCell{position:sticky;left:calc(var(--draftW) + 4px);z-index:5;width:var(--uniW);min-width:var(--uniW);max-width:var(--uniW)}
th.draftHead,th.uniHead{z-index:8}
td.draftCell{background:#102039}.draftBtn{width:100%;height:52px;border-radius:10px;background:#1f8f4e;border-color:#48d67f;color:white;font-size:11px;line-height:12px}.draftBtn:disabled{background:#555;border-color:#777;color:#aaa}
.tile{background:linear-gradient(180deg,#1f3454,#152845);font-size:24px;cursor:pointer}.tile small{display:block;font-size:10px;color:#bdd3ee}
.disabled{opacity:.38;filter:grayscale(.6)}
.university{background:#101826;color:#8096af;font-size:12px}
.revealed{background:linear-gradient(180deg,#173d2a,#0f281c);border-color:#3bae66;font-size:13px;line-height:14px;padding:4px;overflow:hidden;text-overflow:ellipsis}
.locked{background:#3a3148;border-color:#c6a8ff;color:#d8c7ff;font-size:24px;cursor:pointer}
.drafted td{color:#fff!important;border-color:rgba(255,255,255,.55)!important}
.specialRow td{background:#6a5015!important;border-color:#ffcc45!important}
.bottomPanel{position:fixed;bottom:0;left:0;right:0;background:rgba(7,14,24,.98);border-top:1px solid var(--line);padding:9px 10px calc(9px + env(safe-area-inset-bottom));z-index:10}
.message{font-size:13px;font-weight:950;line-height:16px;max-height:34px;overflow:hidden}.log{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.72);z-index:30;padding:14px}.hidden{display:none}
.box{width:min(480px,96vw);background:#111c2e;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 18px 60px rgba(0,0,0,.5)}
.box h2{margin:0 0 8px;color:var(--gold);font-size:25px}.box p{font-size:15px;line-height:1.42;color:#d8e6f7}.actions{display:grid;gap:8px;margin-top:14px}.actions button{min-height:46px;font-size:15px}
.yes{background:#1f8f4e;border-color:#48d67f}.no{background:#4a2330;border-color:#ff6565}.gold{background:#6a5015;border-color:#ffcc45}
.adminPanel{position:fixed;left:8px;right:8px;bottom:95px;background:#101b2d;border:1px solid var(--gold);border-radius:16px;padding:12px;z-index:22}.adminGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.advReveal{font-size:30px;color:var(--gold);font-weight:1000;text-align:center;margin:14px 0}
@media(min-width:700px){:root{--draftW:110px;--uniW:120px;--cellW:125px;--cellH:64px}h1{font-size:22px}}
.locked small{display:block;font-size:9px;color:#fff;margin-top:2px;line-height:10px}</style>
</head>

function freshState(){
 const points={}, eventMap={}, used=new Set(), hiddenLocks={}, draftedTeams={}; PLAYERS.forEach(p=>points[p]=500);
 while(used.size<EVENT_BAG.length){let r=Math.floor(Math.random()*TEAMS.length),c=1+Math.floor(Math.random()*(COLS.length-1));used.add(r+"-"+c)}

function load(){try{state=JSON.parse(localStorage.getItem("ncaaBetaV12Fixed"))||freshState()}catch(e){state=freshState()}save()}

function snapshot(){state.history.push(JSON.stringify({...state,history:[]}));state.history=state.history.slice(-20)}

function render(){

 const allTeams=state.specialAdded?[...TEAMS,SPECIAL_TEAM]:TEAMS;

function tileClick(r,c){
 if(!canAct())return setMsg("Not your turn"); let p=currentPlayer(), id=r+"-"+c, col=COLS[c], cost=COSTS[col]; if(c===0||state.drafted[r])return;

 spend(p,cost); revealTile(r,c,true); endTurn();
}
function unlockTile(r,c){
 if(!canAct())return setMsg("Not your turn"); let p=currentPlayer(), id=r+"-"+c; if(state.points[p]<100)return setMsg("Need 100 points to unlock");
 snapshot();spend(p,100);delete state.foundLocks[id];addLog(p+" unlocked a tile for 100.");revealTile(r,c,true);endTurn();
}
function revealTile(r,c,trigger){let id=r+"-"+c;state.revealed[id]=true;addLog(`${currentPlayer()} revealed Team ${r+1} — ${COLS[c]}: ${TEAMS[r][COLS[c]]}`);if(trigger&&state.eventMap[id])handleEvent(state.eventMap[id],r,c);save();render()}
function handleEvent(ev,r,c){
 addLog("EVENT: "+ev);
 if(ev==="Choose Player Lose 150 Dynasty Points")chooseTarget("Choose a player to lose 150.",t=>{snapshot();spend(t,150,true);addLog(t+" lost 150.");closeModal();render()},()=>{let arr=state.activePlayers.filter(x=>x!==currentPlayer());let t=arr[Math.floor(Math.random()*arr.length)]||currentPlayer();spend(t,150,true);addLog("Random target: "+t+" lost 150.");closeModal();render()});
 if(ev==="-100 Dynasty Points"){spend(currentPlayer(),100,true);showInfo("EVENT SPACE","-100 Dynasty Points");}
 if(ev==="Must Draft Now")mustDraftNow();
 if(ev==="Special Team Offer")specialOffer();
}
function chooseTarget(prompt,cb,to){showTimed("CHOOSE TARGET",prompt,state.activePlayers.filter(p=>p!==currentPlayer()).map(p=>[p,"gold",()=>cb(p)]),to)}
function mustDraftNow(){showTimed("MUST DRAFT NOW","You must draft any available team.",TEAMS.map((t,i)=>state.drafted[i]?null:[`Team ${i+1}`,"yes",()=>draftTeam(i)]).filter(Boolean),()=>{let av=TEAMS.map((_,i)=>i).filter(i=>!state.drafted[i]);draftTeam(av[Math.floor(Math.random()*av.length)])})}
function specialOffer(){if(!state.specialAvailable)return;showTimed("SPECIAL TEAM OFFER","A special team has entered the draft. Would you like to draft this team?",[["Draft Special Team","gold",draftSpecial],["Pass","no",()=>{state.specialAvailable=false;closeModal();render()}]],()=>{state.specialAvailable=false;addLog("Special team auto-passed.");closeModal();render()})}
function confirmDraft(r){
 if(!canAct())return setMsg("Not your turn"); let p=currentPlayer();
 if(ADV[p]&&r<TEAMS.length)showModal("ARE YOU SURE?","You qualify for a Huge Advantage Team.",[["Draft Selected Team","yes",()=>{snapshot();draftTeam(r)}],["Choose Huge Advantage Team","gold",()=>{snapshot();draftHugeAdv()}],["Cancel","no",closeModal]]);
 else showModal("ARE YOU SURE?","Draft this team?",[["Draft Team","yes",()=>{snapshot();draftTeam(r)}],["Cancel","no",closeModal]]);
}
function draftTeam(r){let p=currentPlayer();for(let c=0;c<COLS.length;c++)state.revealed[r+"-"+c]=true;state.drafted[r]=true;state.draftedBy[r]=p;state.draftedTeams[p]=r<TEAMS.length?TEAMS[r].University:SPECIAL_TEAM.University;addLog(`${p} drafted ${state.draftedTeams[p]}.`);removePlayer(p);closeModal();render();save()}
function draftHugeAdv(){let p=currentPlayer(),team=ADV[p];state.draftedTeams[p]=team;addLog(`${p} CHOSE A HUGE ADVANTAGE TEAM: ${team}`);removePlayer(p);closeModal();showModal("HUGE ADVANTAGE TEAM",`<div class="advReveal">${p}<br>CHOSE A HUGE ADVANTAGE TEAM</div><div class="advReveal">${team}</div>`,[["Continue","yes",()=>{closeModal();render()}]]);save();}
function draftSpecial(){let p=currentPlayer();state.specialAvailable=false;state.specialAdded=true;let r=TEAMS.length;for(let c=0;c<COLS.length;c++)state.revealed[r+"-"+c]=true;state.drafted[r]=true;state.draftedBy[r]=p;state.draftedTeams[p]="North Dakota State";addLog(`${p} drafted North Dakota State.`);removePlayer(p);closeModal();render();save()}
function removePlayer(p){let i=state.activePlayers.indexOf(p);if(i>=0){state.activePlayers.splice(i,1);if(state.active>=state.activePlayers.length)state.active=0}state.turnEndsAt=Date.now()+60000}
function endTurn(){if(state.activePlayers.length){state.active=(state.active+1)%state.activePlayers.length;state.turnEndsAt=Date.now()+60000;if(!anyAffordable(currentPlayer()))setMsg(currentPlayer()+" must draft — no affordable reveals.")}save();render()}
function timeoutTurn(){let p=currentPlayer();if(!p)return; snapshot();let cand=[];TEAMS.forEach((_,r)=>{if(!state.drafted[r])COLS.forEach((col,c)=>{let id=r+"-"+c;if(c>0&&!state.revealed[id]&&!state.foundLocks[id])cand.push([r,c])})});if(!cand.length)return endTurn();let [r,c]=cand[Math.floor(Math.random()*cand.length)],id=r+"-"+c;if(state.hiddenLocks[id]){delete state.hiddenLocks[id];state.foundLocks[id]=true;addLog("Timer expired. Random tile was locked.");endTurn();return}spend(p,COSTS[COLS[c]],true);revealTile(r,c,true);endTurn()}
function showModal(title,text,buttons){clearEventTimer();document.getElementById("modalTitle").textContent=title;document.getElementById("modalText").innerHTML=text;let a=document.getElementById("modalActions");a.innerHTML="";buttons.forEach(([l,cls,fn])=>{let b=document.createElement("button");b.textContent=l;b.className=cls;b.onclick=fn;a.appendChild(b)});document.getElementById("modal").classList.remove("hidden")}
function showTimed(title,text,buttons,to){let left=25;showModal(title,text+`<br><br><b id="eventTimerText">25</b> seconds`,buttons);modalTimer=setInterval(()=>{left--;let e=document.getElementById("eventTimerText");if(e)e.textContent=left;if(left<=0){clearEventTimer();to()}},1000)}
function clearEventTimer(){if(modalTimer){clearInterval(modalTimer);modalTimer=null}}
function closeModal(){clearEventTimer();document.getElementById("modal").classList.add("hidden")}
function showInfo(t,x){showModal(t,x,[["OK","yes",closeModal]])}
function toggleAdmin(){document.getElementById("adminPanel").classList.toggle("hidden")}
function adminSetActive(){let p=document.getElementById("adminPlayer").value,i=state.activePlayers.indexOf(p);if(i>=0){snapshot();state.active=i;state.turnEndsAt=Date.now()+60000;save();render()}}
function nextTurn(){snapshot();endTurn()}
function undoLast(){if(!state.history.length)return setMsg("Nothing to undo");let h=state.history.pop(),old=state.history;state=JSON.parse(h);state.history=old;save();render()}
function resetBoardConfirm(){if(confirm("Reset full board?")){state=freshState();save();render()}}
function updateTimer(){let p=currentPlayer();if(!p){document.getElementById("timer").textContent="DONE";return}let left=Math.max(0,Math.ceil((state.turnEndsAt-Date.now())/1000)),el=document.getElementById("timer");el.textContent="0:"+String(left).padStart(2,"0");el.className="timer"+(left<=10?" danger":left<=30?" warn":"");if(left<=0){state.turnEndsAt=Date.now()+999999;timeoutTurn()}}
load();setupSelects();render();setInterval(updateTimer,500);updateTimer();
</script>

  const mapped = window.PLAYER_IDS && window.PLAYER_IDS[slug];

      if (opt.value === mapped || opt.textContent === mapped) {
        sel.value = opt.value;
        sel.dispatchEvent(new Event("change"));
        break;
      }
    }
  }
  setTimeout(apply, 100);

})();
